name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal web)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    name: Web build and Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Build web interface and server
        run: make build
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload screenshots
        id: screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: warn
      - name: Upload report
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
      - name: Link artifacts in the summary
        if: ${{ !cancelled() }}
        env:
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo "### Playwright artifacts"
            if [ -n "$SCREENSHOTS_URL" ]; then echo "- [Screenshots]($SCREENSHOTS_URL)"; fi
            if [ -n "$REPORT_URL" ]; then echo "- [HTML report and traces]($REPORT_URL)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
